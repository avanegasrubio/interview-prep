<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e74">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column styled as a support queue. Practice questions are tickets; jobs and people are cases with statuses. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15212b; --muted:#5b6b78; --line:#d5dce3;
  --accent:#0f6e74; --accent-ink:#ffffff; --open:#b4561b; --open-bg:#fbeadf; --done:#1d7a44; --done-bg:#e1f3e8;
  --info:#2c5aa0; --info-bg:#e3ecf8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --panel:#18222b; --ink:#e7eef3; --muted:#9aabb8; --line:#2a3743;
  --accent:#4fc1c6; --accent-ink:#06282a; --open:#f0a36b; --open-bg:#3a2518; --done:#6fd49a; --done-bg:#14301f;
  --info:#8fb4ee; --info-bg:#1a2a44; color-scheme:dark}}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,7vw,34px)/1.05 var(--display);margin:0;text-wrap:balance}
h2{font:600 19px/1.25 var(--display);margin:4px 0 0;text-wrap:balance}
h3{font:600 16px/1.3 var(--display);margin:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:0;background:transparent;color:var(--muted);font:700 13px var(--body);padding:10px 2px;border-radius:7px;cursor:pointer;min-width:0}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px;margin:0}
p{margin:0}
.tid{font:500 13px var(--mono);color:var(--muted)}
.pill{font:700 12px var(--body);padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.open{background:var(--open-bg);color:var(--open)}
.pill.done{background:var(--done-bg);color:var(--done)}
.pill.info{background:var(--info-bg);color:var(--info)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font:700 14px var(--body);color:var(--done)}
.check.on .box{border-color:var(--done);background:var(--done-bg)}
.nudge{border-left:4px solid var(--open);background:var(--open-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:15px}
.q{font:600 20px/1.3 var(--display);margin:0;text-wrap:balance}
.answer{border-top:1px dashed var(--line);padding-top:10px;min-width:0}
.answer p{margin:0 0 8px}
.answer pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:13px/1.5 var(--mono);margin:6px 0 0}
.answer ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn{flex:1 1 130px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 15px var(--body);padding:11px 12px;border-radius:9px;cursor:pointer;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--done);color:var(--done)}
.btn.small{flex:0 0 auto;font-size:13px;padding:7px 10px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select,input,textarea{font:15px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea{width:100%;min-height:92px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:15px/1.35 var(--body);width:100%}
.item .t{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--open)}
.dot.done{background:var(--done)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timer{font:600 32px var(--mono);font-variant-numeric:tabular-nums;text-align:center}
audio{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font:700 14px var(--body);z-index:20}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.score div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.score b{display:block;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="spread"><span class="eyebrow">Support queue · interview reps</span><button class="btn small" id="signOut" hidden>Sign out</button></div>
    <h1>Edwin's Interview Reps</h1>
    <p class="muted" id="who" hidden></p>
  </header>

  <section id="auth" hidden></section>

  <nav class="tabs" role="tablist" aria-label="Sections" hidden>
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="jobs" aria-selected="false">Jobs</button>
    <button role="tab" data-tab="people" aria-selected="false">People</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
    <button role="tab" data-tab="week" aria-selected="false">Week</button>
    <button role="tab" data-tab="admin" aria-selected="false" hidden>Admin</button>
  </nav>

  <section id="today" hidden></section>
  <section id="jobs" hidden></section>
  <section id="people" hidden></section>
  <section id="practice" hidden></section>
  <section id="week" hidden></section>
  <section id="admin" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const T=[
 ["Web & HTTP","What happens when you type a website address and press Enter?","<p>The browser looks up the domain's IP address (DNS), opens a secure connection, and sends an HTTP request. The server sends back a response, and the browser renders the page and loads its images, scripts and styles.</p><p>A problem can happen at any step, which is why it's the classic warm-up question.</p>"],
 ["Web & HTTP","What's the difference between a 401 and a 403?","<p><b>401:</b> \"I don't know who you are.\" The login, key or token is missing or invalid.</p><p><b>403:</b> \"I know who you are, but you're not allowed.\" A permissions problem. Your GE work lived here.</p>"],
 ["Web & HTTP","What do 404, 429, 500 and 503 usually mean in a support ticket?","<ul><li><b>404:</b> the thing requested doesn't exist, often a wrong URL or ID.</li><li><b>429:</b> too many requests. The customer hit a rate limit.</li><li><b>500:</b> something broke on the server. Likely a bug to escalate.</li><li><b>503:</b> the service is down or overloaded. Check the status page.</li></ul>"],
 ["Web & HTTP","What's the difference between HTTP and HTTPS?","<p>HTTPS encrypts traffic between the browser and the server using a certificate, so no one in between can read or change it. An expired or mismatched certificate causes browser security warnings.</p>"],
 ["Web & HTTP","Why does \"clear your cache\" or \"try an incognito window\" fix so many issues?","<p>The cache stores old copies of files, and cookies store login sessions. If either is stale or broken, the page misbehaves.</p><p>An incognito window starts clean, so it quickly tells you whether the problem is the browser or the account.</p>"],
 ["APIs & auth","What is a REST API?","<p>A way for two systems to talk over HTTP. Each resource has a URL, and you use methods like GET (read), POST (create), PUT or PATCH (update) and DELETE (remove). Data usually comes back as JSON.</p>"],
 ["APIs & auth","What's the difference between an API key and OAuth?","<p>An API key is one secret that identifies an app, like a password for software.</p><p>OAuth lets a user grant an app limited access to their account without sharing their password. It uses tokens that expire and can be limited to certain permissions.</p>"],
 ["APIs & auth","What are SSO and MFA?","<p><b>SSO</b> (single sign-on): one company login signs you into many apps, through a provider like Okta or Microsoft.</p><p><b>MFA</b> (multi-factor authentication): a second proof, like a phone code, on top of the password.</p>"],
 ["APIs & auth","A customer's API calls started failing with 401 errors this morning. Walk me through it.","<ul><li>Ask what changed.</li><li>Check if the key or token expired or was rotated.</li><li>Check it's sent in the right header and format.</li><li>Check they're not using a test key in production, or the reverse.</li><li>Reproduce the call in Postman with their setup.</li><li>Still failing with a correct setup? Escalate with the request, the response and the timestamp.</li></ul>"],
 ["APIs & auth","What's a webhook, and how would you troubleshoot one that isn't arriving?","<p>A webhook is the reverse of an API call: the service sends a message to the customer's URL when an event happens.</p><p>Check the URL is correct and publicly reachable, that their server answers with a success code quickly, and what the delivery logs show about failures and retries.</p>"],
 ["Debugging","How would you use browser DevTools to troubleshoot a problem?","<p>Open the <b>Console</b> tab for JavaScript errors. Open the <b>Network</b> tab, reproduce the problem, and look for requests in red. Click one to see its status code and response.</p><p>That usually shows whether the problem is the page, the server or the account.</p>"],
 ["Debugging","What's a HAR file, and when would you ask a customer for one?","<p>A recording of every network request the browser made. Ask for one when you can't reproduce the problem yourself, so engineering can see exactly what failed.</p><p>Warn the customer it can contain sensitive data like session tokens.</p>"],
 ["Debugging","How do you approach an error message you've never seen before?","<ul><li>Read the error code, message and timestamp closely.</li><li>Search the docs and the knowledge base.</li><li>Match it to what the user was doing at that moment.</li><li>Try to reproduce it.</li><li>Still can't explain it? Escalate with everything you found.</li></ul>"],
 ["SQL","Write a query to find every user whose email ends in @acme.com.","<pre>SELECT * FROM users\nWHERE email LIKE '%@acme.com';</pre>"],
 ["SQL","What does a JOIN do? Give an example.","<p>It combines rows from two tables that share a value. For example, each order with the customer's name:</p><pre>SELECT orders.id, users.name\nFROM orders\nJOIN users ON orders.user_id = users.id;</pre>"],
 ["SQL","How would you count support tickets per customer, most first?","<pre>SELECT customer_id, COUNT(*) AS ticket_count\nFROM tickets\nGROUP BY customer_id\nORDER BY ticket_count DESC;</pre>"],
 ["Scenarios","A customer says the app is slow. How do you troubleshoot?","<ul><li>Narrow it down: one user or everyone, since when, which action?</li><li>Check the status page and try it yourself.</li><li>In the Network tab, find the slowest request.</li><li>Then check their connection and browser, or escalate with timings if it's the product.</li></ul>"],
 ["Scenarios","It works for you but not for the customer. What do you check?","<p>What's different between you: account and permissions, browser and version, cached data, network (VPN or company firewall), region, and the data in their account.</p><p>Reproduce with settings as close to theirs as possible.</p>"],
 ["Scenarios","You found a real bug, but engineering can't fix it for two weeks. What do you do?","<p>Find a workaround, tell the customer honestly when a fix is expected, and add the workaround to the knowledge base so others get it too. Follow up when the fix ships.</p>"],
 ["Scenarios","Explain what an API is to someone non-technical.","<p>Like a waiter in a restaurant: you tell the waiter what you want, the waiter takes the order to the kitchen (another system), and brings back what you asked for. You never go into the kitchen yourself.</p>"],
 ["Your stories","Tell story 1: The backlog (GE Aerospace).","<ul><li><b>S:</b> The support queue on GE's Apigee platform had a backlog.</li><li><b>T:</b> You owned the queue: auth failures, keys and secrets, config, permissions.</li><li><b>A:</b> Triaged by urgency and impact, first response under 2 hours, 15+ tickets a week, documented every fix.</li><li><b>R:</b> Backlog down 30% in three months.</li></ul>"],
 ["Your stories","Tell story 2: The repeat question (GE Aerospace).","<ul><li><b>S:</b> The same kind of ticket kept coming from different teams.</li><li><b>T:</b> Fixing each one from scratch wasn't scaling.</li><li><b>A:</b> Wrote the fix up as a knowledge base entry and pointed people to it.</li><li><b>R:</b> Those tickets closed faster or stopped coming back.</li></ul><p class=\"hint\">Use your real example of which issue it was.</p>"],
 ["Your stories","Tell story 3: The escalation (GE Aerospace).","<ul><li><b>S:</b> A user reported a failure you couldn't fix with config.</li><li><b>T:</b> Find out if it was yours to fix or engineering's.</li><li><b>A:</b> Reproduced it, traced logs and request data, escalated with the diagnosis attached, kept the user updated.</li><li><b>R:</b> Use the real outcome: how fast it got fixed.</li></ul>"],
 ["Your stories","Tell story 4: Explaining it plainly (NIA Entertainment).","<ul><li><b>S:</b> Go-to technical contact for NIA since June 2023. They aren't technical.</li><li><b>T:</b> A time they needed to make a decision.</li><li><b>A:</b> Explained the problem and options in plain language and recommended one.</li><li><b>R:</b> They decided with confidence. Renewed without a break for 3+ years.</li></ul>"],
 ["Your stories","Tell story 5: The live-site bug (NIA Entertainment).","<ul><li><b>S:</b> A user reported a bug on the live site.</li><li><b>T:</b> Fix it without breaking anything else.</li><li><b>A:</b> Reproduced it, found the cause, tested the fix before release, documented it.</li><li><b>R:</b> Use the real outcome: how fast, and that it didn't come back.</li></ul>"],
 ["Your stories","Tell story 6: Working on the nerves.","<ul><li><b>S:</b> Skills were solid, but live calls made you nervous.</li><li><b>T:</b> Get genuinely comfortable talking live.</li><li><b>A:</b> Technical Sales Training (General Assembly & Adobe), and daily calls on purpose.</li><li><b>R:</b> Calls feel normal now. You can think while you talk.</li></ul>"]
];

/* ---------- storage ---------- */
const KEY="edwin-reps-v1", KEY2="edwin-tracker-v1";
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=load(KEY,{}); S.done=S.done||{}; S.days=S.days||[];
let D=load(KEY2,{}); D.jobs=D.jobs||{}; D.people=D.people||[]; D.events=D.events||[]; D.custom=D.custom||[]; D.remind=D.remind||{time:"07:30",days:"work"};
const saveD=()=>save(KEY2,D);
const saveS=()=>{save(KEY,S);syncPractice()};

/* ---------- Supabase sync ---------- */
const SB_URL="https://hmglutaxerbpfxzwnnbn.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtZ2x1dGF4ZXJicGZ4endubmJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3OTkwNDQsImV4cCI6MjEwNjM3NTA0NH0.Vj2RA-30UnVXIOzG-V-hAGp1M5yhPF--_VZvQlzvVWs";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let ME=null, ROLE=null;
function fail(e){if(e){console.error(e);toast("Couldn't save. Check your connection.")}}
let pTimer=null;
function syncPractice(){if(!sb||!ME)return;clearTimeout(pTimer);pTimer=setTimeout(async()=>{
  const {error}=await sb.from("practice").upsert({user_id:ME.id,done:S.done,days:S.days,remind:D.remind,updated_at:new Date().toISOString()});fail(error)},600)}
async function syncStatus(id){if(!sb||!ME)return;const st=D.jobs[id];if(!st)return;
  const {error}=await sb.from("job_status").upsert({user_id:ME.id,job_id:id,status:st.status,applied_at:st.appliedAt||null,reply_at:st.replyAt||null,interview_at:st.interviewAt||null,offer_at:st.offerAt||null,followed_up:st.followedUp||null,notes:st.notes||null,updated_at:new Date().toISOString()});fail(error)}
const personRow=p=>({id:p.id,user_id:p.user_id||ME.id,first:p.first,last:p.last,company:p.company,position:p.position,url:p.url,status:p.status,messaged_at:p.messagedAt||null,replied_at:p.repliedAt||null,followed_up:p.followedUp||null,source:p.source||null});
const personFrom=r=>({id:r.id,user_id:r.user_id,first:r.first||"",last:r.last||"",company:r.company||"",position:r.position||"",url:r.url||"",status:r.status,messagedAt:r.messaged_at,repliedAt:r.replied_at,followedUp:r.followed_up,source:r.source});
async function syncPerson(p){if(!sb||!ME)return;const {error}=await sb.from("people").upsert(personRow(p));fail(error)}
async function syncPeopleBulk(list){if(!sb||!ME)return;for(let i=0;i<list.length;i+=400){const {error}=await sb.from("people").upsert(list.slice(i,i+400).map(personRow));if(error){fail(error);return}}}
async function removePerson(id){if(!sb||!ME)return;const {error}=await sb.from("people").delete().eq("id",id);fail(error)}
const jobFrom=r=>({id:r.id,company:r.company,role:r.role,match:r.match,pay:r.pay,where:r.location,url:r.url,resume:r.resume,why:r.why,watch:r.watch,added:r.added,custom:r.custom,active:r.active});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
const daysSince=iso=>{if(!iso)return null;const a=new Date(iso+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.round((b-a)/864e5)};
const nice=iso=>iso?new Date(iso+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("Copied")}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Select the text and copy it")}ta.remove()}}
function logEvent(type,label){const e={type,label,at:today()};D.events.push(e);saveD();
  if(sb&&ME)sb.from("events").insert({user_id:ME.id,type,label,at:e.at}).then(({error})=>fail(error))}
function markPracticed(){if(!S.days.includes(today()))S.days.push(today());saveS()}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return dkey(d)}

/* ---------- jobs data (vetted list lives in jobs.json, status lives on this phone) ---------- */
let JOBS=[];
async function loadAll(){
  if(!sb||!ME){JOBS=load("edwin-jobs-cache",[]);renderAll();return}
  const [j,st,pp,ev,pr]=await Promise.all([
    sb.from("jobs").select("*").eq("active",true),
    sb.from("job_status").select("*").eq("user_id",ME.id),
    sb.from("people").select("*").eq("user_id",ME.id),
    sb.from("events").select("*").eq("user_id",ME.id).order("at"),
    sb.from("practice").select("*").eq("user_id",ME.id).maybeSingle()]);
  if(j.error){toast("Couldn't load. Showing what's saved on this phone.");JOBS=load("edwin-jobs-cache",[]);renderAll();return}
  JOBS=j.data.map(jobFrom);save("edwin-jobs-cache",JOBS);
  const migrated=load("edwin-migrated-"+ME.id,false);
  // First sign-in on this phone: move anything saved locally up to the account
  if(!migrated){
    const ups=[];
    Object.entries(D.jobs).forEach(([id,v])=>{if(JOBS.some(x=>x.id===id)&&!(st.data||[]).some(r=>r.job_id===id))ups.push(syncStatus(id))});
    if(D.people.length&&!(pp.data||[]).length)ups.push(syncPeopleBulk(D.people.map(p=>({...p,user_id:ME.id}))));
    if(D.events.length&&!(ev.data||[]).length)ups.push(sb.from("events").insert(D.events.map(e=>({user_id:ME.id,type:e.type,label:e.label,at:e.at}))));
    if(!pr.data&&(Object.keys(S.done).length||S.days.length))ups.push(sb.from("practice").upsert({user_id:ME.id,done:S.done,days:S.days,remind:D.remind}));
    await Promise.all(ups);save("edwin-migrated-"+ME.id,true);

let active=null;
function setupRecorder(box){
  const btn=box.querySelector("[data-rec]"),timer=box.querySelector("[data-timer]"),play=box.querySelector("[data-play]");
  if(!(navigator.mediaDevices&&window.MediaRecorder)){btn.disabled=true;btn.textContent="Recording isn't supported in this browser";return}
  btn.onclick=async()=>{
    if(active&&active.box===box){active.stop();return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Allow microphone access to record");return}
    const rec=new MediaRecorder(stream),chunks=[];let left=90,iv;
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{clearInterval(iv);stream.getTracks().forEach(t=>t.stop());timer.hidden=true;btn.textContent="Record again";active=null;
      const url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||"audio/mp4"}));play.innerHTML=`<p class="muted">Play it back. Did you hit Situation, Task, Action, Result?</p><audio controls src="${url}"></audio>`};
    active={box,stop:()=>{if(rec.state!=="inactive")rec.stop()}};
    rec.start();timer.hidden=false;btn.textContent="Stop recording";play.innerHTML="";
    const show=()=>timer.textContent=Math.floor(left/60)+":"+pad(left%60);show();
    iv=setInterval(()=>{left--;show();if(left<=0)active&&active.stop()},1000)};
}

function parseCsv(text){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
function importConnections(text){
  const rows=parseCsv(text);const h=rows.findIndex(r=>r.some(c=>c.trim()==="First Name"));
  if(h<0){toast("That file doesn't look like LinkedIn's Connections.csv");return}
  const head=rows[h].map(c=>c.trim());const ix=n=>head.indexOf(n);
  let added=0;const seen=new Set(D.people.map(p=>p.url||p.first+p.last+p.company));
  rows.slice(h+1).forEach(r=>{const p={first:r[ix("First Name")]||"",last:r[ix("Last Name")]||"",url:r[ix("URL")]||"",company:r[ix("Company")]||"",position:r[ix("Position")]||"",status:"To message",source:"LinkedIn"};
    if(!p.first&&!p.last)return;const k=p.url||p.first+p.last+p.company;if(seen.has(k))return;seen.add(k);p.id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);p._new=1;D.people.push(p);added++});
  saveD();renderAll();toast(added+" connections imported");syncPeopleBulk(D.people.filter(p=>p._new).map(p=>{delete p._new;return p}))}
function score(p){let s=0;const co=(p.company||"").toLowerCase(),pos=(p.position||"").toLowerCase();

  <div class="row"><button class="btn small" data-log="applied">+ Application</button><button class="btn small" data-log="reply">+ Reply</button><button class="btn small" data-log="interview">+ Interview</button><button class="btn small" data-log="offer">+ Offer</button></div></div>
  <div class="card"><h3>Recent activity</h3>${recent.length?recent.map(e=>`<div class="spread"><span>${label[e.type]||e.type}${e.label?" · "+esc(e.label):""}</span><span class="tid">${nice(e.at)}</span></div>`).join(""):`<p class="muted">Nothing logged yet this week.</p>`}</div>`;
  $("#cpScore").onclick=()=>copy(text);
  v.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{logEvent(b.dataset.log,"Logged");renderAll();toast("Logged")})}

/* ---------- calendar reminders ---------- */
function downloadIcs(){
  const [hh,mm]=(D.remind.time||"07:30").split(":");const now=new Date();
  const d=new Date();d.setDate(d.getDate()+1);const ds=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const sat=new Date();sat.setDate(sat.getDate()+((6-sat.getDay()+7)%7||7));const ss=sat.getFullYear()+pad(sat.getMonth()+1)+pad(sat.getDate());
  const stamp=now.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";const url=location.origin;
  const byday=D.remind.days==="all"?"":";BYDAY=MO,TU,WE,TH,FR";
  const ev=(uid,start,rule,sum,desc,dur)=>["BEGIN:VEVENT","UID:"+uid+"@interview-reps","DTSTAMP:"+stamp,"DTSTART:"+start,"DURATION:"+dur,"RRULE:"+rule,"SUMMARY:"+sum,"DESCRIPTION:"+desc,"URL:"+url,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+sum,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Interview Reps//EN","CALSCALE:GREGORIAN",
    ev("study-"+Date.now(),ds+"T"+hh+mm+"00","FREQ=DAILY"+byday,"15 min interview reps","One ticket, answered out loud. Open "+url,"PT15M"),
    ev("apply-"+Date.now(),ss+"T100000","FREQ=WEEKLY;BYDAY=SA","Send this week's applications","Open the Jobs tab and send at least 3. "+url,"PT45M"),
    "END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="interview-reps-reminders.ics";document.body.appendChild(a);a.click();a.remove();
  toast("Open the file to add the reminders")}

/* ---------- tabs ---------- */
/* ---------- ADMIN ---------- */
let adminMember=null;
async function renderAdmin(){
  const v=$("#admin");if(ROLE!=="admin"){v.innerHTML="";return}
  v.innerHTML=`<p class="muted">Loading...</p>`;
  const acc=await sb.rpc("member_accounts");
  if(acc.error){v.innerHTML=`<p class="muted">Couldn't load members.</p>`;return}
  const members=(acc.data||[]).filter(m=>m.role!=="admin");
  if(!adminMember&&members.length)adminMember=members[0].user_id;
  const m=members.find(x=>x.user_id===adminMember);
  let body="";
  if(!m){body=`<div class="card"><h3>Waiting for Edwin</h3><p class="muted">He shows up here once he creates his account with his email on the sign-in screen.</p></div>`}
  else{
    const ws=weekStart();
    const [st,ev,pp,pr]=await Promise.all([
      sb.from("job_status").select("*").eq("user_id",m.user_id),
      sb.from("events").select("*").eq("user_id",m.user_id).gte("at",ws),
      sb.from("people").select("*").eq("user_id",m.user_id),
      sb.from("practice").select("*").eq("user_id",m.user_id).maybeSingle()]);
    const c=t=>(ev.data||[]).filter(e=>e.type===t).length;
    const stById={};(st.data||[]).forEach(r=>stById[r.job_id]=r);
    const ppl=pp.data||[];const byStatus=k=>ppl.filter(p=>p.status===k).length;
    const days=(pr.data&&pr.data.days)||[];const resolved=pr.data?Object.keys(pr.data.done||{}).length:0;
    const practicedWeek=days.filter(d=>d>=ws).length;
    body=`<div class="card"><div class="spread"><h3>${esc(m.display_name||m.email)} this week</h3><span class="tid">Week of ${nice(ws)}</span></div>
      <div class="score"><div><b>${c("applied")}</b><span>Applications</span></div><div><b>${c("reply")}</b><span>Replies</span></div><div><b>${c("interview")}</b><span>Interviews</span></div><div><b>${c("offer")}</b><span>Offers</span></div></div>
      <p class="muted">Practiced ${practicedWeek} ${practicedWeek===1?"day":"days"} this week · ${resolved} of ${T.length} tickets resolved</p></div>
    <div class="card"><h3>Jobs</h3>${JOBS.map(j=>{const r=stById[j.id];const s=r?r.status:"To apply";
      return `<div class="spread"><span><b>${esc(j.company)}</b> · ${esc(j.role)}${r&&r.applied_at?` <span class="muted">· applied ${nice(r.applied_at)}</span>`:""}</span><span class="row"><span class="pill ${s==="To apply"?"open":"done"}">${esc(s)}</span><button class="btn small" data-archive="${esc(j.id)}">Archive</button></span></div>`}).join("")||`<p class="muted">No active jobs.</p>`}</div>
    <div class="card"><h3>Outreach</h3><p class="muted">${ppl.length} contacts · ${byStatus("To message")} to message · ${byStatus("Messaged")} messaged · ${byStatus("Replied")} replied · ${byStatus("Referral")} referrals</p>
      ${ppl.filter(p=>p.source==="Assigned").map(p=>`<div class="spread"><span>${esc(p.first)} ${esc(p.last)} · <span class="muted">${esc(p.company||"")}</span></span><span class="pill ${p.status==="To message"?"open":"done"}">${esc(p.status)}</span></div>`).join("")}</div>
    <div class="card"><h3>Send him a contact to reach out to</h3>
      <div class="row"><label class="field" for="xFirst">First name<input id="xFirst"></label><label class="field" for="xLast">Last name<input id="xLast"></label></div>
      <div class="row"><label class="field" for="xCo">Company<input id="xCo"></label><label class="field" for="xPos">Role<input id="xPos"></label></div>
      <label class="field" for="xUrl">LinkedIn profile link<input id="xUrl" inputmode="url"></label><button class="btn primary" id="xAdd">Add to his People list</button></div>`}
  v.innerHTML=`${members.length>1?`<label class="field" for="mSel">Viewing<select id="mSel">${members.map(x=>`<option value="${esc(x.user_id)}"${x.user_id===adminMember?" selected":""}>${esc(x.display_name||x.email)}</option>`).join("")}</select></label>`:""}
  ${body}
  <div class="card"><h3>Add a vetted job</h3><p class="muted">It appears on the Jobs tab for everyone right away.</p>
    <div class="row"><label class="field" for="vCo">Company<input id="vCo"></label><label class="field" for="vRole">Role<input id="vRole"></label></div>
    <div class="row"><label class="field" for="vMatch">Match %<input id="vMatch" inputmode="numeric"></label><label class="field" for="vPay">Pay<input id="vPay"></label></div>
    <label class="field" for="vWhere">Where<input id="vWhere"></label><label class="field" for="vUrl">Posting link<input id="vUrl" inputmode="url"></label>
    <label class="field" for="vResume">Resume file name<input id="vResume"></label>
    <label class="field" for="vWhy">Why it fits<textarea id="vWhy"></textarea></label><label class="field" for="vWatch">Watch out for<textarea id="vWatch"></textarea></label>
    <button class="btn primary" id="vAdd">Add job</button></div>`;
  const sel=$("#mSel");if(sel)sel.onchange=e=>{adminMember=e.target.value;renderAdmin()};
  v.querySelectorAll("[data-archive]").forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Tap to confirm";return}
    const {error}=await sb.from("jobs").update({active:false}).eq("id",b.dataset.archive);if(error){fail(error);return}JOBS=JOBS.filter(j=>j.id!==b.dataset.archive);toast("Archived");renderAdmin()});
  const xa=$("#xAdd");if(xa)xa.onclick=async()=>{const p={id:"a"+Date.now().toString(36),user_id:m.user_id,first:$("#xFirst").value.trim(),last:$("#xLast").value.trim(),company:$("#xCo").value.trim(),position:$("#xPos").value.trim(),url:$("#xUrl").value.trim(),status:"To message",source:"Assigned"};
    if(!p.first){toast("Add at least a first name");return}const {error}=await sb.from("people").insert(p);if(error){fail(error);return}toast("Added to his list");renderAdmin()};
  $("#vAdd").onclick=async()=>{const co=$("#vCo").value.trim(),ro=$("#vRole").value.trim();if(!co||!ro){toast("Add a company and a role");return}
    const row={id:(co+"-"+ro).toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)+"-"+Date.now().toString(36).slice(-4),company:co,role:ro,match:parseInt($("#vMatch").value)||null,pay:$("#vPay").value.trim()||null,location:$("#vWhere").value.trim()||null,url:$("#vUrl").value.trim()||null,resume:$("#vResume").value.trim()||null,why:$("#vWhy").value.trim()||null,watch:$("#vWatch").value.trim()||null};
    const {error}=await sb.from("jobs").insert(row);if(error){fail(error);return}JOBS.push(jobFrom({...row,added:today()}));toast("Job added");renderAdmin()};
}

/* ---------- sign in ---------- */
function showApp(on){$(".tabs").hidden=!on;$("#auth").hidden=on;Object.keys(views).forEach(k=>$("#"+k).hidden=!on||k!==tab);$("#signOut").hidden=!on&&!ME}
function renderAuth(mode,msg){
  showApp(false);const v=$("#auth");
  if(!sb){v.innerHTML=`<div class="card"><h3>Can't reach the sign-in service</h3><p class="muted">Check your internet connection, then reload the app.</p></div>`;return}
  if(mode==="notmember"){v.innerHTML=`<div class="card"><h3>This account isn't on the list yet</h3><p class="muted">Signed in as ${esc(ME.email)}. Ask Ari to add this email, then reload.</p></div>`;$("#signOut").hidden=false;return}
  if(mode==="reset"){v.innerHTML=`<div class="card"><h3>Set a new password</h3><label class="field" for="npw">New password<input type="password" id="npw" autocomplete="new-password"></label><button class="btn primary" id="npwGo">Save password</button></div>`;
    $("#npwGo").onclick=async()=>{const {error}=await sb.auth.updateUser({password:$("#npw").value});if(error){toast(error.message);return}toast("Password updated");boot()};return}
  v.innerHTML=`<div class="card"><h3>${mode==="signup"?"Create your account":"Sign in"}</h3>
    ${msg?`<div class="nudge">${esc(msg)}</div>`:""}
    <label class="field" for="em">Email<input type="email" id="em" autocomplete="email" inputmode="email"></label>
    <label class="field" for="pw">Password<input type="password" id="pw" autocomplete="${mode==="signup"?"new-password":"current-password"}"></label>
    <button class="btn primary" id="go">${mode==="signup"?"Create account":"Sign in"}</button>
    <div class="row"><button class="btn small" id="swap">${mode==="signup"?"I already have an account":"Create an account"}</button>${mode==="signup"?"":`<button class="btn small" id="forgot">Forgot password</button>`}</div>
    <p class="muted">Your progress, jobs and contacts sync across your phone and computer.</p></div>`;
  $("#swap").onclick=()=>renderAuth(mode==="signup"?"signin":"signup");
  const fg=$("#forgot");if(fg)fg.onclick=async()=>{const em=$("#em").value.trim();if(!em){toast("Enter your email first");return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});if(error){toast(error.message);return}renderAuth("signin","Check your email for a reset link.")};
  $("#go").onclick=async()=>{const email=$("#em").value.trim(),password=$("#pw").value;if(!email||!password){toast("Enter your email and password");return}
    $("#go").disabled=true;
    if(mode==="signup"){const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});$("#go").disabled=false;
      if(error){toast(error.message);return}if(!data.session){renderAuth("signin","Check your email and tap the confirm link. Then come back here and sign in.");return}}
    else{const {error}=await sb.auth.signInWithPassword({email,password});$("#go").disabled=false;if(error){toast(error.message==="Invalid login credentials"?"Wrong email or password":error.message);return}}};
}
async function enter(user){
  ME=user;const res=await sb.from("members").select("email,role,display_name");const error=res.error;
  const data=(res.data||[]).find(r=>r.email.toLowerCase()===(user.email||"").toLowerCase());
  if(error){toast("Couldn't check your account. Try again.");return}
  if(!data){renderAuth("notmember");return}
  ROLE=data.role;$("#who").textContent="Signed in as "+user.email;$("#who").hidden=false;
  document.querySelector('[data-tab="admin"]').hidden=ROLE!=="admin";
  showApp(true);$("#signOut").hidden=false;await loadAll()}
async function boot(){
  if(!sb){renderAuth("signin");return}
  const {data:{session}}=await sb.auth.getSession();
  if(session)enter(session.user);else renderAuth("signin");
}
if(sb)sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){ME=session&&session.user;renderAuth("reset");return}
  if(ev==="SIGNED_IN"&&session&&(!ME||ME.id!==session.user.id))enter(session.user);
  if(ev==="SIGNED_OUT"){ME=null;ROLE=null;$("#who").hidden=true;renderAuth("signin")}});
$("#signOut").onclick=()=>sb&&sb.auth.signOut();

const views={today:renderToday,jobs:renderJobs,people:renderPeople,practice:renderPractice,week:renderWeek,admin:renderAdmin};
let tab="today";
function renderAll(){views[tab]()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  Object.keys(views).forEach(k=>$("#"+k).hidden=k!==tab);if(tab==="jobs")openJob=null;if(tab==="people")openPerson=null;if(tab==="practice")current=null;renderAll();window.scrollTo(0,0)});
boot();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}
</script>
